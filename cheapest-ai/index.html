<style>
  :root{
    --bg:#F7F6F2; --surface:#FFFFFF; --ink:#191815; --soft:#615E57; --line:#E0DDD4;
    --indigo:#3A2BD4; --amber:#F4C95D; --mint:#A6DBAE; --sky:#A4CBF2;
    --display:'Fraunces',serif; --body:'Inter',sans-serif; --hand:'Gaegu',cursive;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.6;-webkit-font-smoothing:antialiased}
  a{color:inherit}
  .wrap{max-width:1060px;margin:0 auto;padding:0 24px}

  header{position:sticky;top:0;z-index:20;background:rgba(247,246,242,.88);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .bar{display:flex;align-items:center;justify-content:space-between;min-height:64px;gap:16px;flex-wrap:wrap;padding:8px 0}
  .mark{font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:-.02em;text-decoration:none;white-space:nowrap}
  .mark span{color:var(--indigo)}
  .langs{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .langs button{font-family:var(--body);font-size:13px;padding:5px 11px;border-radius:999px;
    border:1px solid var(--line);background:transparent;color:var(--soft);cursor:pointer;transition:.15s}
  .langs button:hover{border-color:var(--indigo);color:var(--ink)}
  .langs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

  .hero{padding:72px 0 24px;text-align:center}
  .eyebrow{font-family:var(--hand);font-size:22px;color:var(--indigo);margin-bottom:14px}
  .hero h1{font-family:var(--display);font-weight:700;letter-spacing:-.025em;line-height:1.1;
    font-size:clamp(2.1rem,5.4vw,3.7rem);max-width:22ch;margin:0 auto}
  .hero p{margin:22px auto 0;font-size:clamp(1rem,2.2vw,1.13rem);color:var(--soft);max-width:52ch}

  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px;margin:52px 0 8px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px}
  .card h3{font-family:var(--display);font-size:17px;font-weight:600;margin-bottom:8px}
  .card p{font-size:14px;color:var(--soft)}
  .chip{display:inline-block;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;
    background:var(--mint);margin-bottom:10px}
  .chip.sky{background:var(--sky)} .chip.amber{background:var(--amber)}

  section.block{margin:64px 0}
  section.block h2{font-family:var(--display);font-size:26px;font-weight:600;margin-bottom:10px}
  section.block > .lede{color:var(--soft);font-size:15px;margin-bottom:24px;max-width:64ch}

  .picks{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
  .pick{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;
    display:flex;flex-direction:column}
  .pick .cat{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--indigo);margin-bottom:8px}
  .pick .name{font-family:var(--display);font-weight:600;font-size:17px;margin-bottom:10px;line-height:1.3}
  .pick .note{font-size:14px;color:var(--soft);flex:1}
  .pick .watch{font-size:13px;color:var(--ink);background:var(--bg);border-radius:9px;
    padding:10px 12px;margin-top:14px;border:1px solid var(--line)}
  .pick .watch b{font-weight:600}
  .pick a.go{margin-top:14px;display:inline-block;font-size:14px;font-weight:600;color:var(--indigo);text-decoration:none}
  .pick a.go:hover{text-decoration:underline}

  .method{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}
  .method div h3{font-family:var(--display);font-size:16px;font-weight:600;margin-bottom:6px}
  .method div p{font-size:14px;color:var(--soft)}

  .notice{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--amber);
    border-radius:12px;padding:16px 18px;font-size:14px;color:var(--soft);margin:16px 0}
  .notice b{color:var(--ink)}

  footer{border-top:1px solid var(--line);margin-top:64px;padding:26px 0 48px;
    font-size:13px;color:var(--soft);text-align:center;line-height:1.9}
</style>
</head>

</div>

var SUPPORTED = ['en','ko','zh','ja'];

function esc(s){ return String(s).replace(/[&<>"]/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

function renderPicks(t){
  var html = PRODUCTS.map(function(prod){
    var d = t.p[prod.id];
    return '<div class="pick">'
      + '<div class="cat">' + esc(d.cat) + '</div>'
      + '<div class="name">' + esc(d.name) + '</div>'
      + '<p class="note">' + esc(d.note) + '</p>'
      + '<div class="watch"><b>' + esc(t.watchLabel) + '</b> ' + esc(d.watch) + '</div>'
      + '<a class="go" href="' + prod.url + '" target="_blank" rel="sponsored noopener">'
      + esc(t.goLabel) + ' ' + esc(prod.store) + ' →</a>'
      + '</div>';
  }).join('');
  document.getElementById('picks').innerHTML = html;
}

function apply(lang){
  var t = I18N[lang] || I18N.en;
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(function(el){
    var v = t[el.getAttribute('data-i18n')];
    if (v !== undefined) el.textContent = v;
  });
  renderPicks(t);
  document.querySelectorAll('.langs button').forEach(function(b){
    b.setAttribute('aria-pressed', String(b.getAttribute('data-lang') === lang));
  });
  try { localStorage.setItem('cheapest-ai-lang', lang); } catch (e) {}
}

function initialLang(){
  var saved;
  try { saved = localStorage.getItem('cheapest-ai-lang'); } catch (e) {}
  if (saved && SUPPORTED.indexOf(saved) >= 0) return saved;
  var nav = (navigator.language || 'en').toLowerCase();
  if (nav.indexOf('ko') === 0) return 'ko';
  if (nav.indexOf('zh') === 0) return 'zh';
  if (nav.indexOf('ja') === 0) return 'ja';
  return 'en';
}

document.querySelectorAll('.langs button').forEach(function(b){
  b.addEventListener('click', function(){ apply(b.getAttribute('data-lang')); });
});
apply(initialLang());
</script>
